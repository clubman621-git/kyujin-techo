
<script type="text/javascript">
$(document).ready(function() {

    // 変数に制限値と可否を設定します
    let codeAssistSelectableOne = false;
    let codeAssistSelectableTwo = true;
    let codeAssistSelectableThree = true;
    let codeAssistSelectableFour = true;

    let codeAssistSelectLimitOne = 3;
    let codeAssistSelectLimitTwo = 3;
    let codeAssistSelectLimitThree = 5;
    let codeAssistSelectLimitFour = 5;

    let codeAssistLimitTotalTwo = false;
    let codeAssistLimitTotalThree = false;
    let codeAssistLimitTotalFour = true;

    let codeAssistDelimitTwo = false;
    let codeAssistDelimitThree = true;
    let codeAssistDelimitFour = false;

    let allCodeAssistSelectLimitTwo;
    let allCodeAssistSelectLimitThree;
    let allCodeAssistSelectLimitFour;

    if (codeAssistDelimitTwo) {
        if (codeAssistLimitTotalThree) {
            allCodeAssistSelectLimitTwo = codeAssistSelectLimitOne * codeAssistSelectLimitTwo;
            allCodeAssistSelectLimitThree = allCodeAssistSelectLimitTwo;
            allCodeAssistSelectLimitFour = allCodeAssistSelectLimitThree * codeAssistSelectLimitFour;
        } else if (codeAssistLimitTotalFour) {
            allCodeAssistSelectLimitTwo = codeAssistSelectLimitOne * codeAssistSelectLimitTwo;
            allCodeAssistSelectLimitThree = allCodeAssistSelectLimitTwo * codeAssistSelectLimitThree;
            allCodeAssistSelectLimitFour = allCodeAssistSelectLimitThree;
        } else {
            allCodeAssistSelectLimitTwo = codeAssistSelectLimitOne * codeAssistSelectLimitTwo;
            allCodeAssistSelectLimitThree = allCodeAssistSelectLimitTwo * codeAssistSelectLimitThree;
            allCodeAssistSelectLimitFour = allCodeAssistSelectLimitThree * codeAssistSelectLimitFour;
        }
    } else if (codeAssistDelimitThree) {
        if (codeAssistLimitTotalFour) {
            allCodeAssistSelectLimitTwo = codeAssistSelectLimitTwo;
            allCodeAssistSelectLimitThree = codeAssistSelectLimitTwo * codeAssistSelectLimitThree;
            allCodeAssistSelectLimitFour = allCodeAssistSelectLimitThree;
        } else {
            allCodeAssistSelectLimitTwo = codeAssistSelectLimitTwo;
            allCodeAssistSelectLimitThree = codeAssistSelectLimitTwo * codeAssistSelectLimitThree;
            allCodeAssistSelectLimitFour = allCodeAssistSelectLimitThree * codeAssistSelectLimitFour;
        }
    } else if (codeAssistDelimitFour) {
        allCodeAssistSelectLimitTwo = codeAssistSelectLimitTwo;
        allCodeAssistSelectLimitThree = codeAssistSelectLimitThree;
        allCodeAssistSelectLimitFour = codeAssistSelectLimitThree * codeAssistSelectLimitFour;
    } else {
        allCodeAssistSelectLimitTwo = codeAssistSelectLimitTwo;
        allCodeAssistSelectLimitThree = codeAssistSelectLimitThree;
        allCodeAssistSelectLimitFour = codeAssistSelectLimitFour;
    }

    let getCheckboxes = (level) => {
        switch (level) {
            case 1:
                return $('.accordion .ac_headerOne input[type="checkbox"]'); // 第一階層
            case 2:
                return $('.accordion .accordion-content .ac_headerTwo input[type="checkbox"]'); // 第二階層
            case 3:
                return $('.accordion .accordion-content .accordion-content .ac_headerThree input[type="checkbox"]'); // 第三階層
            case 4:
                return $('.accordion .accordion-content .accordion-content .accordion-content .ac_headerFour input[type="checkbox"]'); // 第四階層
            default:
                return $();
        }
    };

    $('#ID_ok4').removeClass('disable').prop('disabled', false);

 // チェックされたチェックボックスの数をカウントする関数
    function countChecked(checkboxes) {
        return checkboxes.filter(':checked').length;
    }

 // 子供はチェックされているが自身はチェックされていないチェックボックスの数をカウントする関数
    function countSquare(checkboxes) {
        return checkboxes.filter('.check_square').length;
    }

    function applyLimits(checkboxes, limit, disableParent, delimiter, allLimit, delimitTotal, disableChild) {
        let checkedCount = countChecked(checkboxes);
        let squareCount = countSquare(checkboxes);
        let $delimitedHeader;
        let $delimitedCheckboxes;
        let delimitedCheckCount;
        let delimitedSquareCount;
        let $delimitedTotalCheckboxes;
        let delimitedTotalCheckCount;
        let $delimitedChildCheckboxes;
        let allLimitReached = checkedCount + squareCount >= allLimit;
        let allDelimitedTotalCheckboxes = [];

        checkboxes.each(function() {
            const $checkbox = $(this);
            const isChecked = $checkbox.is(':checked');
            const hasSquare = $checkbox.hasClass('check_square');
            const $parent = $checkbox.closest('.accordion-content').prev().find('input[type="checkbox"]');
            const $parentHeader = $checkbox.closest('.accordion-content').prev();

            if (delimiter && (isChecked || hasSquare)) {
                $delimitedHeader = $parentHeader.next('.accordion-content').children('.accordion_item').children('.checkbox').children('.accordion').children('.accordion-item').children('.acco_header');
                $delimitedCheckboxes = $delimitedHeader.find('input[type="checkbox"]');
                delimitedCheckCount = $delimitedCheckboxes.filter(':checked').length; // 親の中でチェックされているボックスの数
                delimitedSquareCount = $delimitedCheckboxes.filter('.check_square').length; // 親の中でcheck_squareが適用されているボックスの数
                // 子階層の項目が全て選択された場合、親を選択状態にし、子階層の選択状態を全解除
                if (delimitedCheckCount >= $delimitedCheckboxes.length) {
                    if ($delimitedCheckboxes.length >= 2) { // 子階層の項目が一個しかない場合は除く
                        if ($parent.css('display') !== 'none') {
                            $delimitedCheckboxes.each(function() {
                                const $delimitedCheckbox = $(this);
                                $delimitedCheckbox.prop('checked', false);
                            });
                            $parent.removeClass('check_square').addClass('checkbox_check').prop('checked', true);
                            $parent.closest('.forLabel').removeClass('isSquare');
                        }
                    }
                }

                if (delimitTotal) {
                    $delimitedTotalCheckboxes = $parentHeader.next('.accordion-content').find('input[type="checkbox"]');
                    allDelimitedTotalCheckboxes.push($delimitedTotalCheckboxes);
                }
            }

            // チェックされているボックスは無効化しない
            if (isChecked) {
                return; // チェックされている場合は何もしない
            }

            // 子供はチェックされているが自身はチェックされていないボックスは無効化しない
            if (hasSquare) {
                return; // check_squareが適用されている場合は何もしない
            }

            // 親階層がリミットに達した場合、自身を無効化
            if (disableParent) {
                $checkbox.prop('disabled', true);
            } else if (delimiter) { // 親ごとに子供を制限するフラグがtrueの場合
                if (delimitTotal) {
                    if (($parent.is(':disabled')) && (!$parent.hasClass('check_square'))) { // 子供が選択されていない親が無効化されたら子供も無効化する
                        $checkbox.prop('disabled', true);
                    } else if (allLimitReached || (delimitedTotalCheckCount >= limit)) { // 自身がリミットに達している場合、または親階層と共にリミットに達した場合に無効化
                        $checkbox.prop('disabled', true);
                    } else {
                        $checkbox.prop('disabled', false); // リミットに達していない場合は無効化を解除
                    }
                } else if (disableChild) {
                	if (($parent.is(':disabled')) && (!$parent.hasClass('check_square'))) { // 子供が選択されていない親が無効化されたら子供も無効化する
                        $checkbox.prop('disabled', true);
                    } else if ((!$parent.is(':disabled')) && (!$parent.hasClass('check_square')) && (!$parent.is(':checked'))){
                        $checkbox.prop('disabled', false); // リミットに達していない場合は無効化を解除
                    }
                } else {
                    if (($parent.is(':disabled')) && (!$parent.hasClass('check_square'))) { // 子供が選択されていない親が無効化されたら子供も無効化する
                        $checkbox.prop('disabled', true);
                    } else if (allLimitReached || (delimitedCheckCount + delimitedSquareCount >= limit)) { // 自身がリミットに達している場合、または親階層と共にリミットに達した場合に無効化
                        $checkbox.prop('disabled', true);
                    } else {
                        $checkbox.prop('disabled', false); // リミットに達していない場合は無効化を解除
                    }
                }
            } else {
                if (($parent.is(':disabled')) && (!$parent.hasClass('check_square'))) { // 子供が選択されていない親が無効化されたら子供も無効化する
                    $checkbox.prop('disabled', true);
                } else if (checkedCount + squareCount >= limit) { // 自身がリミットに達している場合、または親階層と共にリミットに達した場合に無効化
                    $checkbox.prop('disabled', true);
                } else {
                    $checkbox.prop('disabled', false); // リミットに達していない場合は無効化を解除
                }
            }

            if (($parent.hasClass('check_square')) && ($parent.is(':disabled'))) {
                $parent.prop('disabled', false);
            }

        });

        // codeAssistDelimit○○とlimitTotal○○を併用している場合、delimiter=trueの階層以下の区切られたチェックボックスのチェック数を数えて無効化・無効化解除を行う
        if (allDelimitedTotalCheckboxes.length > 0) {
            for (var i = 0; i < allDelimitedTotalCheckboxes.length; i++) {
                allDelimitedTotalCheckboxes[i].each(function() {
                    delimitedTotalCheckCount = allDelimitedTotalCheckboxes[i].filter(':checked').length;
                    const $delimitChildCheckbox = $(this);
                    const delimitChildIsChecked = $delimitChildCheckbox.is(':checked');
                    const delimitChildHasSquare = $delimitChildCheckbox.hasClass('check_square');
                    const $delimitParent = $delimitChildCheckbox.closest('.accordion-content').prev().find('input[type="checkbox"]');

                    // チェックされているボックスは無効化しない
                    if (delimitChildIsChecked) {
                        return; // チェックされている場合は何もしない
                    }

                    // 子供はチェックされているが自身はチェックされていないボックスは無効化しない
                    if (delimitChildHasSquare) {
                        return; // check_squareが適用されている場合は何もしない
                    }

                    // 自身がリミットに達している場合、または親階層と共にリミットに達した場合に無効化
                    if (allLimitReached || (delimitedTotalCheckCount >= limit)) {
                        $delimitChildCheckbox.prop('disabled', true);
                    } else {
                        $delimitChildCheckbox.prop('disabled', false);
                    }

                    if (($delimitParent.hasClass('check_square')) && ($delimitParent.is(':disabled'))) {
                        $delimitParent.prop('disabled', false);
                    }

                });
            }
        }
        //アコーディオンボタンCSS設定
        updateAccordionButtonStyles();

    }

    function updateCheckboxStates() {
        let firstLevelCheckboxes = getCheckboxes(1);
        let secondLevelCheckboxes = getCheckboxes(2);
        let thirdLevelCheckboxes = getCheckboxes(3);
        let fourthLevelCheckboxes = getCheckboxes(4);
        // 第一階層の制限
        let firstLevelCheckedCount = countChecked(firstLevelCheckboxes);
        let firstLevelLimitReached = firstLevelCheckedCount >= codeAssistSelectLimitOne;

        // 第二階層の制限
        let secondLevelCheckedCount = countChecked(secondLevelCheckboxes);
        let secondLevelLimitReached = secondLevelCheckedCount >= allCodeAssistSelectLimitTwo;

        // 第三階層の制限
        let thirdLevelCheckedCount = countChecked(thirdLevelCheckboxes);
        let thirdLevelLimitReached = thirdLevelCheckedCount >= allCodeAssistSelectLimitThree;

        // 第四階層の制限
        let fourthLevelCheckedCount = countChecked(fourthLevelCheckboxes);
        let fourthLevelLimitReached = fourthLevelCheckedCount >= allCodeAssistSelectLimitFour;

        // 第一階層のリミットに基づいてチェックボックスの状態を更新
        if (firstLevelLimitReached) {
            applyLimits(firstLevelCheckboxes, codeAssistSelectLimitOne, true, false, codeAssistSelectLimitOne, false, false);
        } else {
            applyLimits(firstLevelCheckboxes, codeAssistSelectLimitOne, false, false, codeAssistSelectLimitOne, false, false);
        }

        // 第二階層の制限を適用
        if (codeAssistLimitTotalTwo) {
            if (firstLevelLimitReached || (firstLevelCheckedCount + secondLevelCheckedCount >= codeAssistSelectLimitOne)) {
                applyLimits(firstLevelCheckboxes, codeAssistSelectLimitOne, true, false, codeAssistSelectLimitOne, false, false);
                applyLimits(secondLevelCheckboxes, codeAssistSelectLimitTwo, true, false, allCodeAssistSelectLimitTwo, false, false);
            } else {
                applyLimits(secondLevelCheckboxes, codeAssistSelectLimitTwo, false, false, allCodeAssistSelectLimitTwo, false, false);
            }
        } else {
            if (codeAssistDelimitTwo) {
                applyLimits(secondLevelCheckboxes, codeAssistSelectLimitTwo, false, true, allCodeAssistSelectLimitTwo, false, false);
            } else {
                applyLimits(secondLevelCheckboxes, codeAssistSelectLimitTwo, false, false, allCodeAssistSelectLimitTwo, false, false);
            }
        }

        // 第三階層の制限を適用
        if (codeAssistLimitTotalThree) {
            if (codeAssistDelimitTwo) {
                applyLimits(secondLevelCheckboxes, codeAssistSelectLimitTwo, false, true, allCodeAssistSelectLimitTwo, true, false); // delimitTotalをtrueに
                applyLimits(thirdLevelCheckboxes, codeAssistSelectLimitThree, false, true, allCodeAssistSelectLimitThree, false, true); // disableChildをtrueに
            } else {
                if (secondLevelLimitReached || (secondLevelCheckedCount + thirdLevelCheckedCount >= codeAssistSelectLimitTwo)) {
                    applyLimits(secondLevelCheckboxes, codeAssistSelectLimitTwo, true, false, allCodeAssistSelectLimitTwo, false, false);
                    applyLimits(thirdLevelCheckboxes, codeAssistSelectLimitThree, true, false, allCodeAssistSelectLimitThree, false, false);
                } else {
                    applyLimits(thirdLevelCheckboxes, codeAssistSelectLimitThree, false, false, allCodeAssistSelectLimitThree, false, false);
                }
            }
        } else {
            if (codeAssistDelimitTwo || codeAssistDelimitThree) {
                applyLimits(thirdLevelCheckboxes, codeAssistSelectLimitThree, false, true, allCodeAssistSelectLimitThree, false, false);
            } else {
                applyLimits(thirdLevelCheckboxes, codeAssistSelectLimitThree, false, false, allCodeAssistSelectLimitThree, false, false);
            }
        }

        // 第四階層の制限を適用
        if (codeAssistLimitTotalFour) {
            if (codeAssistDelimitTwo || codeAssistDelimitThree) {
                applyLimits(thirdLevelCheckboxes, codeAssistSelectLimitThree, false, true, allCodeAssistSelectLimitThree, true, false); // delimitTotalをtrueに
                applyLimits(fourthLevelCheckboxes, codeAssistSelectLimitFour, false, true, allCodeAssistSelectLimitFour, false, true); // disableChildをtrueに
            } else {
                if (thirdLevelLimitReached || (thirdLevelCheckedCount + fourthLevelCheckedCount >= allCodeAssistSelectLimitThree)) {
                    applyLimits(thirdLevelCheckboxes, codeAssistSelectLimitThree, true, false, allCodeAssistSelectLimitThree, false, false);
                    applyLimits(fourthLevelCheckboxes, codeAssistSelectLimitFour, true, false, allCodeAssistSelectLimitFour, false, false);
                } else {
                    applyLimits(fourthLevelCheckboxes, codeAssistSelectLimitFour, false, false, allCodeAssistSelectLimitFour, false, false);
                }
            }
        } else {
            if (codeAssistDelimitTwo || codeAssistDelimitThree || codeAssistDelimitFour) {
                applyLimits(fourthLevelCheckboxes, codeAssistSelectLimitFour, false, true, allCodeAssistSelectLimitFour, false, false);
            } else {
                applyLimits(fourthLevelCheckboxes, codeAssistSelectLimitFour, false, false, allCodeAssistSelectLimitFour, false, false);
            }
        }

    }

    function initCheckboxListeners() {
        $('input[type="checkbox"]').on('change', updateCheckboxStates);
        let $deliHeader;
        let $deliCheckboxes;
        let deliCheckCount;

        $('.checkbox_check').each(function() {
            $(this).off('change').on('change', () => {
                let parentCheckbox = $(this).closest('.accordion-content').prev().find('input[type="checkbox"]');
                let parent2Checkbox = parentCheckbox.closest('.accordion-content').prev().find('input[type="checkbox"]');
                let parent3Checkbox = parent2Checkbox.closest('.accordion-content').prev().find('input[type="checkbox"]');
                let parentLabel = parentCheckbox.closest('.forLabel');
                let parent2Label = parent2Checkbox.closest('.forLabel');
                let parent3Label = parent3Checkbox.closest('.forLabel');
                const $pareHeader = $(this).closest('.accordion-content').prev();
                $deliHeader = $pareHeader.next('.accordion-content').children('.accordion_item').children('.checkbox').children('.accordion').children('.accordion-item').children('.acco_header');
                $deliCheckboxes = $deliHeader.find('input[type="checkbox"]');
                deliCheckCount = $deliCheckboxes.filter(':checked').length; // 親の中でチェックされているボックスの数
                const $myHeader = $(this).parent().parent();
                const $myChildren = $myHeader.next('.accordion-content').find('input[type="checkbox"]');

                if (parentCheckbox.length) {
                    if ($(this).is(':checked')) { // 自身がチェックされた場合
                        parentCheckbox.addClass('check_square').removeClass('checkbox_check').prop('checked', false);
                        parentLabel.addClass('isSquare');
                    } else {
                        let siblings = $(this).closest('.accordion-content').find('.checkbox_check');
                        if (!siblings.is(':checked') && $(this).hasClass('check_square')) {
                            parentCheckbox.removeClass('check_square').addClass('checkbox_check');
                            parentLabel.removeClass('isSquare');

                        }
                    }
                    updateCheckboxStates();
                }

                if (parent2Checkbox.length) {
                    if (parentCheckbox.hasClass('check_square') || parentCheckbox.is(':checked')) { // 親がチェックされているか、check_squareが適用されている場合
                        parent2Checkbox.addClass('check_square').removeClass('checkbox_check').prop('checked', false);
                        parent2Label.addClass('isSquare');
                    } else {
                        parent2Checkbox.removeClass('check_square').addClass('checkbox_check');
                        parent2Label.removeClass('isSquare');
                    }
                    updateCheckboxStates();
                }

                if (parent3Checkbox.length) {
                    if (parent2Checkbox.hasClass('check_square') || parent2Checkbox.is(':checked')) { // 第二の親がチェックされているか、check_squareが適用されている場合
                        parent3Checkbox.addClass('check_square').removeClass('checkbox_check').prop('checked', false);
                        parent3Label.addClass('isSquare');
                    } else {
                        parent3Checkbox.removeClass('check_square').addClass('checkbox_check');
                        parent3Label.removeClass('isSquare');
                    }
                    updateCheckboxStates();
                }

                // 子階層の項目が選択されている親を選択した場合、子階層の選択状態を全解除
                if (($(this).is(':checked')) && (deliCheckCount >= 1)) {
                    if ($(this).css('display') !== 'none') {
                        $myChildren.each(function() {
                            const $myChild = $(this);
                            let myChildLabel = $myChild.closest('.forLabel');
                            $myChild.removeClass('check_square').addClass('checkbox_check').prop('checked', false);
                            myChildLabel.removeClass('isSquare');
                        });
                        $(this).removeClass('check_square').addClass('checkbox_check').prop('checked', true);
                        $(this).closest('.forLabel').removeClass('isSquare');
                    }
                    updateCheckboxStates();
                }

            });
        });


        // 各レベルのチェックボックスにリスナーを追加
        [1, 2, 3, 4].forEach(level => {
            let checkboxes = getCheckboxes(level);

            checkboxes.each(function() {
                $(this).off('change').on('change', () => {
                    let parentCheckbox = $(this).closest('.accordion-content').prev().find('input[type="checkbox"]');
                    let parent2Checkbox = parentCheckbox.closest('.accordion-content').prev().find('input[type="checkbox"]');
                    let parent3Checkbox = parent2Checkbox.closest('.accordion-content').prev().find('input[type="checkbox"]');
                    let parentLabel = parentCheckbox.closest('.forLabel');
                    let parent2Label = parent2Checkbox.closest('.forLabel');
                    let parent3Label = parent3Checkbox.closest('.forLabel');
                    const $pareHeader = $(this).closest('.accordion-content').prev();
                    $deliHeader = $pareHeader.next('.accordion-content').children('.accordion_item').children('.checkbox').children('.accordion').children('.accordion-item').children('.acco_header');
                    $deliCheckboxes = $deliHeader.find('input[type="checkbox"]');
                    deliCheckCount = $deliCheckboxes.filter(':checked').length; // 親の中でチェックされているボックスの数
                    const $myHeader = $(this).parent().parent();
                    const $myChildren = $myHeader.next('.accordion-content').find('input[type="checkbox"]');

                    if (parentCheckbox.length) {
                        let siblingCheckboxes = $(this).closest('.accordion-content').find('input[type="checkbox"]');
                        if ($(this).is(':checked')) {
                            parentCheckbox.addClass('check_square').removeClass('checkbox_check').prop('checked', false);
                            parentLabel.addClass('isSquare');
                        } else {
                            if (!siblingCheckboxes.is(':checked')) {
                                parentCheckbox.removeClass('check_square').addClass('checkbox_check');
                                parentLabel.removeClass('isSquare');
                                
                                
                            }
                        }
                        updateCheckboxStates();
                    }

                    if (parent2Checkbox.length) {
                        let sibling2Checkboxes = parentCheckbox.closest('.accordion-content').find('input[type="checkbox"]');
                        if (parentCheckbox.hasClass('check_square')) {
                            parent2Checkbox.addClass('check_square').removeClass('checkbox_check').prop('checked', false);
                            parent2Label.addClass('isSquare');
                        } else {
                            if (!sibling2Checkboxes.is(':checked')) {
                                parent2Checkbox.removeClass('check_square').addClass('checkbox_check');
                                parent2Label.removeClass('isSquare');
                            }
                        }
                        updateCheckboxStates();
                    }

                    if (parent3Checkbox.length) {
                        let sibling3Checkboxes = parent2Checkbox.closest('.accordion-content').find('input[type="checkbox"]');
                        if (parent2Checkbox.hasClass('check_square')) {
                            parent3Checkbox.addClass('check_square').removeClass('checkbox_check').prop('checked', false);
                            parent3Label.addClass('isSquare');
                        } else {
                            if (!sibling3Checkboxes.is(':checked')) {
                                parent3Checkbox.removeClass('check_square').addClass('checkbox_check');
                                parent3Label.removeClass('isSquare');
                            }
                        }
                        updateCheckboxStates();
                    }

                    // 子階層の項目が選択されている親を選択した場合、子階層の選択状態を全解除
                    if (($(this).is(':checked')) && (deliCheckCount >= 1)) {
                        if ($(this).css('display') !== 'none') {
                            $myChildren.each(function() {
                                const $myChild = $(this);
                                let myChildLabel = $myChild.closest('.forLabel');
                                $myChild.removeClass('check_square').addClass('checkbox_check').prop('checked', false);
                                myChildLabel.removeClass('isSquare');
                            });
                            $(this).removeClass('check_square').addClass('checkbox_check').prop('checked', true);
                            $(this).closest('.forLabel').removeClass('isSquare');
                        }
                        updateCheckboxStates();
                    }

                });
            });
        });
    }

    // 確定ボタンのイベントハンドラを追加
    $(document).off('click', '#ID_ok4').on('click', '#ID_ok4', function () {
	    var selected = $('div.accordion_container input[type="checkbox"]:checked');

	    var selectedValues = [];
	    var selectedNames = []; // 選択された名前を格納する配列

	    selected.each(function () {
	        var value = $(this).val();
	        selectedValues.push(value); // 各選択されたチェックボックスの値を追加

	        // button要素のテキストを取得
	        var buttonText = $(this).parent().text().trim(); // 親のbuttonからテキストを取得
	        selectedNames.push(buttonText); // 名前を追加
	    });

	    // 選択されているチェックボックスが属するカテゴリを取得
	    var category = $(selected[0]).closest('div.ac_inner').prev('div.acco_header');
	    var categoryId = category.find('input[type="hidden"]').val();
	    var categoryName = category.text().trim();

	    let codeAssistCode = ID_todohukenHidden;
	    let codeAssistCodeName = ID_todohukenNameLbl;

	    // カテゴリ名を設定
	    $(codeAssistCodeName).val(categoryName);

	    // CODEの構築
	    var CODE;

	    CODE = categoryId ? categoryId + ',' + selectedValues.join(',') : selectedValues.join(',');

	    // 結果をinputに出力
	    $(codeAssistCode).val(CODE); // CODEをコード返却先ボックスに出力

	    // 名前を設定
	    $(codeAssistCodeName).val(selectedNames.join(', ')); // 選択された名前を名称返却先ボックスに出力
	    $(codeAssistCodeName).text(selectedNames.join('　')); // 選択された名前を名称返却先ボックスに出力

	    // 追加処理のfunctionを設定
	    
	        let todoufukenFunc = execOkTodohukenModal;
	            todoufukenFunc();
	    
	});

    $(document).off('click', '#ID_iaClearButton').on('click', '#ID_iaClearButton', function () {
        // 全てのチェックボックスのチェックを外す
        $('input[name^="skCheck"]').prop('checked', false);
        $('.accordion .acco_header').removeClass('open');
        $('.accordion .ac_inner').slideUp('fast');

        $('input[type="checkbox"]').closest('.accordion-content').prev().find('input[type="checkbox"]').removeClass('check_square').addClass('checkbox_check');
        $('input[type="checkbox"]').closest('.accordion-content').prev().find('input[type="checkbox"]').closest('.forLabel').removeClass('isSquare');


        // チェックを外した後に状態を更新
        updateCheckboxStates();
    });
    
    //アコーディオンボタンCSS設定
	function updateAccordionButtonStyles() {
	  const headers = document.querySelectorAll('.accordion_container .accordion .ac_headerStyle');

	  headers.forEach(header => {
	    const checkbox = header.querySelector('input[type="checkbox"]');
	    if (!checkbox) return;

	    // 初期状態に応じてクラスを設定
	    if (checkbox.checked && !checkbox.classList.contains('check_square')) {
	      header.classList.add('accordionCheckBoxColor');
	    } else {
	      header.classList.remove('accordionCheckBoxColor');
	    }
	  });
	}
    // 初期化処理
    initCheckboxListeners();

    $(document).off('click', '.ac_headerThree').on('click', '.ac_headerThree', function (event) {
		var browser = getBrowserInfo();
		// firefoxのV75未満か判定
		if (browser.isFirefox && browser.firefoxVersion < 75) {
			console.log("start 座標取得");
			// 座標取得
			const x = event.clientX;
			const y = event.clientY;
			const elem = document.elementFromPoint(x, y);
			// labelの位置取得
			const chil = elem.children[0];
			const inputRect = chil.getBoundingClientRect();
			const isInsideLable = x >= inputRect.left && x <= inputRect.right && y >= inputRect.top && y <= inputRect.bottom;
			if (isInsideLable) {
				chil.children[0].dispatchEvent(new Event('change'));
				return; // `notAccordionOpen` クラスが含まれている場合は処理をスキップ
			}
		}
		// クリックイベントが `notAccordionOpen` クラスの要素内で発生した場合は処理を終了
		if ($(event.target).closest('.notAccordionOpen').length) {
			return; // チェックボックスをクリックした場合
		}
		let target = $(this);
		if (!target.next('div').length) {
			let val = target.find('input[type="checkbox"]').val();

			$.ajax({
				url: 'ECZTDFMDLGetFourth.do',
				type: 'POST',
				dataType: 'json',
				data: {
					screenId: 'GECZTDFMDL',
					action: 'getFourth',
					thirdCode: val
				}
			})
			.done(function(data) {
				let str = '<div class="accordion-content ac_inner ac_innerStyle"><ul class="accordion_item prefecture_head">';
				for (let item in data.codeMap) {
					let tdCd = item.substring(10);
					let idCd = tdCd + '9' + tdCd;
					str = str + '<li class="checkbox"><div class="accordion accordion_container"><label class="accordion-item arrowBtn_wrap accordion arrowBtn_checkBox">';
					str = str + '<button type="button" class="acco_header ac_headerStyle ac_headerFour arrowBtn_base arrowBtn_font btn_textLeft arrowBtn_color2 arrowBtn_color2_rem prefecture_child open">';
					str = str + '<label for="ID_skCheck' + idCd + '" class="notAccordionOpen forLabel">';
					str = str + '<input type="checkbox" class="checkbox_check notAccordionOpen" name="skCheck' + tdCd + '" id="ID_skCheck' + idCd + '" value="' + tdCd + '">';
					str = str + data.codeMap[item];
					str = str + '</label></button></div></li>';
				}
				str = str + '</ul></div>';
				target.after(str);
				target.next('div').slideDown();
				initCheckboxListeners();
				updateCheckboxStates();
			})
			.fail(function() {
				alert('通信に失敗しました。再度操作をやり直してください。');
			});
		}
	});
});
</script>
