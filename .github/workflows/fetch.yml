name: 求人を取得

on:
  schedule:
    - cron: "17 21 * * *"   # 毎朝 6:17（日本時間）
  workflow_dispatch:
    inputs:
      mode:
        description: "daily（新着のみ） / full（全件） / discover（フォーム調査）"
        default: daily

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: discover
        if: ${{ github.event.inputs.mode == 'discover' }}
        run: python scripts/discover.py
      - name: save discover output
        if: ${{ github.event.inputs.mode == 'discover' }}
        run: |
          git config user.name "kyujin-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan discover
          git rm -rq --cached .
          git add -f out/
          git commit -qm "discover output"
          git push -f origin discover
      - name: fetch
        if: ${{ github.event.inputs.mode != 'discover' }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            # 日曜の朝だけ全件を読み直して、締め切られた求人を外す
            if [ "$(TZ=Asia/Tokyo date +%u)" = 7 ]; then MODE=full; else MODE=daily; fi
          fi
          python scripts/fetch.py --mode "$MODE"
      - name: commit
        if: ${{ github.event.inputs.mode != 'discover' }}
        run: |
          git config user.name "kyujin-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "求人データ更新 $(TZ=Asia/Tokyo date +%F)"
          git pull --rebase -q
          git push
